<h2>Connexion</h2>
<form (submit)="login(); $event.preventDefault()">
  <div>
    <label for="email">Email:</label>
    <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="Entrez votre email">
  </div>

  <div>
    <label for="password">Mot de passe:</label>
    <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="Entrez votre mot de passe">
  </div>

  <div>
    <input type="submit" value="Se connecter">
  </div>

  <p *ngIf="message">{{ message }}</p> <!-- Affichage conditionnel du message -->

</form>

<!-- Bouton "Je souhaite m'inscrire" centré sous le formulaire -->
<div style="text-align: center; margin-top: 20px;">
  <ion-button routerLink="/inscription">Je souhaite m'inscrire</ion-button>
</div>
