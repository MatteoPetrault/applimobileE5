<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">Retour</ion-button>
    </ion-buttons>
    <ion-title>Liste des événements</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mes événements</ion-title>
      <div *ngIf="inscriptionMessage" class="inscription-message">
        {{ inscriptionMessage }}
      </div>
    </ion-toolbar>
  </ion-header>

  <ion-grid *ngIf="events.length > 0; else noEvents">
    <ion-row>
      <ion-col size="3"><strong>Label</strong></ion-col>
      <ion-col size="3"><strong>Date</strong></ion-col>
      <ion-col size="3"><strong>Désinscription</strong></ion-col>
    </ion-row>
    <ion-row *ngFor="let event of events">
      <ion-col size="3">{{ event.label }}</ion-col>
      <ion-col size="3">{{ event.date | date: 'dd/MM/yyyy' }}</ion-col>
      <ion-col size="3">
        <!-- Passer l'ID de l'événement au clic -->
        <ion-button expand="full" color="danger" (click)="presentUnsubscribeConfirmation(event.id)">
          Se désinscrire
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ng-template #noEvents>
    <ion-text color="medium">
      <h3>Aucun événement trouvé pour cet utilisateur.</h3>
    </ion-text>
  </ng-template>
</ion-content>
